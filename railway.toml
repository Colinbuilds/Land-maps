# Railway reads this automatically. Add a Volume mounted at /var/data in the
# Railway dashboard so leads, settings and the map cache survive redeploys.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
