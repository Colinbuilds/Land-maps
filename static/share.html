<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Service Info</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f2; color: #10231a; }
  .bar { background: #10231a; color: #fff; padding: 14px 16px; font-weight: 800; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 26px; margin: 0 0 12px; letter-spacing: -.02em; }
  video, img { width: 100%; border-radius: 14px; background: #000; display: block; }
  .txt { white-space: pre-wrap; background: #fff; border-radius: 14px; padding: 16px; margin-top: 14px; }
  .cta { display: block; text-align: center; background: #15803d; color: #fff; text-decoration: none; font-weight: 700; border-radius: 99px; padding: 15px; margin-top: 18px; }
</style>
</head>
<body>
<div class="bar">Home Service Info</div>
<main id="m">Loading…</main>
<script>
(async () => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tok = location.pathname.split("/")[2];
  const r = await fetch(`/api/public/marketing/${encodeURIComponent(tok)}`);
  if (!r.ok) { document.getElementById("m").textContent = "This link isn't available."; return; }
  const it = await r.json();
  document.title = it.title;
  const src = `/m/${encodeURIComponent(tok)}/file`;
  const media = !it.has_file ? "" : (it.mime || "").startsWith("video/") ? `<video src="${src}" controls playsinline preload="metadata"></video>`
    : (it.mime || "").startsWith("image/") ? `<img src="${src}" alt="${esc(it.title)}">` : `<a class="cta" href="${src}">Download</a>`;
  document.getElementById("m").innerHTML = `<h1>${esc(it.title)}</h1>${media}${it.body ? `<div class="txt">${esc(it.body)}</div>` : ""}
    <a class="cta" href="/join">See how it works</a>`;
})();
</script>
</body>
</html>
