<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Report</title>
<link rel="stylesheet" href="/static/styles.css?v=10">
<style>
  :root { --accent: #1d4ed8; }
  header.top { background: var(--accent); color: #fff; border: 0; }
  header.top .contact { color: #e0e7ff; }
  .cover { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 18px; }
  @media (max-width: 800px) { .cover { grid-template-columns: 1fr; } }
  .cover img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
  .big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .kv { width: 100%; }
  .kv td { padding: 6px 4px; }
  .kv td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .sw2 { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  svg text { font: 700 10px system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  tr.sug td { background: #dcfce7; font-weight: 700; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  @media print { .actions { display: none; } body { background: #fff; } .card { break-inside: avoid; } }
  .tradegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tradegrid .card { margin: 0; }
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="co">Property Report</div>
  <div class="contact" id="coContact"></div>
</header>
<main class="stack" id="main"><p class="muted"><span class="spinner"></span>Loading report…</p></main>
<script src="/static/common.js?v=20"></script>
<script>
const COLORS = { ridge: "#dc2626", hip: "#ea580c", valley: "#2563eb", rake: "#16a34a", eave: "#a16207", step_flashing: "#9333ea", flashing: "#0891b2" };
const ORDER = ["ridge", "hip", "valley", "rake", "eave", "step_flashing", "flashing"];
(async function () {
  const rid = location.pathname.split("/")[2];
  const t = new URLSearchParams(location.search).get("t");
  let r;
  const qp = new URLSearchParams();
  if (t) qp.set("t", t);
  const trq = new URLSearchParams(location.search).get("trades");
  if (trq) qp.set("trades", trq);
  const qs = qp.toString() ? `?${qp}` : "";
  try { r = await api(`/api/roof/report/${rid}${qs}`); }
  catch (e) { document.getElementById("main").innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  const d = r.data, c = r.company, L = d.lines;
  document.documentElement.style.setProperty("--accent", c.brand_color || "#1d4ed8");
  document.getElementById("co").textContent = c.name || "Property Report";
  document.getElementById("coContact").textContent = [c.phone, c.email].filter(Boolean).join(" · ");
  document.title = `Property Report – ${d.address}`;
  const ft = (v) => `${Math.round(v).toLocaleString()} ft`;
  const share = `${location.origin}/r/${r.id}?t=${r.share_token}`;
  const sug = (d.waste || []).find((w) => w.suggested);
  document.getElementById("main").innerHTML = `
    <div class="actions">
      <a class="btn" href="/r/${r.id}/pdf${qs}" target="_blank">Download PDF</a>
      <a class="btn secondary" href="/r/${r.id}/postcard.pdf?${new URLSearchParams({ ...(t ? { t } : {}), ...(r.trades && r.trades[0] ? { trade: r.trades[0] } : {}) })}" target="_blank" title="Print-ready 9 x 6 in postcard with 1/8 in bleed">Mail postcard</a>
      <a class="btn secondary" href="/r/${r.id}/photo.jpg${t ? `?t=${encodeURIComponent(t)}` : ""}" target="_blank">Aerial photo</a>
      <button class="secondary" id="copy">Copy share link</button>
      <span class="small muted" id="copied"></span>
    </div>
    <div>
      <h1 style="margin-bottom:2px">Property Measurement Report</h1>
      <div class="muted">${esc(d.address)}, ${esc((d.city || "").toLowerCase().replace(/\b\w/g, (m) => m.toUpperCase()))} NE ${esc(d.zip || "")} · Parcel ${esc(String(d.pin).split(':').pop())}${d.county_name ? ` · ${esc(d.county_name)}` : ''} · Report ${esc(r.id)} · ${new Date(r.created * 1000).toLocaleDateString(undefined, { dateStyle: "long" })}</div>
    </div>
    ${(r.trade_summaries || []).length ? `<div class="tradegrid">${r.trade_summaries.map(tradeCard).join("")}</div>` : tradeCard(r.trade_summary)}
    ${d.lines ? `<div class="cover">
      <div class="card">${d.aerial_jpg ? `<img alt="Aerial photo of the property" src="data:image/jpeg;base64,${d.aerial_jpg}">` : ""}</div>
      <div class="card">
        <div class="muted small">Total roof area</div>
        <div class="big">${d.roof_sqft.toLocaleString()} sq ft</div>
        <div class="muted">${d.squares.toFixed(2)} squares · ${sug.squares.toFixed(2)} with ${sug.pct}% suggested waste</div>
        <table class="kv" style="margin-top:12px">
          <tr><td>Predominant pitch</td><td>${esc(d.pitch_label)}</td></tr>
          <tr><td>Roof facets</td><td>${d.facets || "–"}</td></tr>
          <tr><td>Structures</td><td>${d.structures.length}</td></tr>
          <tr><td>Under tree canopy</td><td>${(d.tree_overhang_sqft || 0).toLocaleString()} sq ft</td></tr>
          ${ORDER.map((k) => `<tr><td><span class="sw2" style="background:${COLORS[k]}"></span>${esc(d.line_labels[k])}</td><td>${ft(L[k] || 0)}</td></tr>`).join("")}
          <tr><td>Drip edge (eaves + rakes)</td><td>${ft(d.derived.drip_edge)}</td></tr>
          <tr><td>Ridge cap (ridges + hips)</td><td>${ft(d.derived.ridge_cap)}</td></tr>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Length diagram</h2>
      <p class="small muted" style="margin-top:-8px">True lengths in feet, using each roof plane's own pitch. North is up.</p>
      ${diagram(d)}
      <div class="legend">${ORDER.map((k) => `<span><i class="sw2" style="background:${COLORS[k]}"></i>${esc(d.line_labels[k])} ${Math.round(L[k] || 0)}'</span>`).join("")}${d.tree_overhang_sqft ? `<span><i class="sw2" style="background:repeating-linear-gradient(45deg,#15803d 0 2px,#dcfce7 2px 4px);height:10px"></i>Under trees ${d.tree_overhang_sqft.toLocaleString()} sq ft</span>` : ""}</div>
      ${d.tree_note ? `<p class="small" style="color:#15803d">${esc(d.tree_note)}</p>` : ""}
    </div>
    <div class="grid2">
      <div class="card">
        <h2>Waste calculation</h2>
        <table><thead><tr><th>Waste</th><th class="num">Area (sq ft)</th><th class="num">Squares</th><th></th></tr></thead><tbody>
        ${d.waste.map((w) => `<tr class="${w.suggested ? "sug" : ""}"><td>${w.pct}%</td><td class="num">${w.area.toLocaleString()}</td><td class="num">${w.squares.toFixed(2)}</td><td>${w.suggested ? "Suggested" : ""}</td></tr>`).join("")}
        </tbody></table>
        <p class="small muted">Squares are rounded up to the nearest 1/3 square (one bundle).</p>
      </div>
      <div class="card">
        <h2>Areas per pitch</h2>
        <table><thead><tr><th>Pitch</th><th class="num">Area (sq ft)</th><th class="num">% of roof</th></tr></thead><tbody>
        ${(d.pitch_table || []).map((p) => `<tr><td>${esc(p.pitch)}</td><td class="num">${p.area.toLocaleString()}</td><td class="num">${p.pct}%</td></tr>`).join("")}
        </tbody></table>
        <h2 style="margin-top:16px">Structures</h2>
        <div class="tablewrap"><table><thead><tr><th>Structure</th><th class="num">Roof sq ft</th><th class="num">Facets</th><th class="num">Ridges</th><th class="num">Hips</th><th class="num">Valleys</th><th class="num">Rakes</th><th class="num">Eaves</th></tr></thead><tbody>
        ${d.structures.map((s) => `<tr><td>${esc(s.name)}</td><td class="num">${s.roof_sqft.toLocaleString()}</td><td class="num">${s.facets || "–"}</td>${["ridge", "hip", "valley", "rake", "eave"].map((k) => `<td class="num">${Math.round(s.lines[k])}</td>`).join("")}</tr>`).join("")}
        </tbody></table></div>
        <p class="small muted">Pitch measured per roof plane from LiDAR, rounded to the nearest 1/12. Roof outlines: ${esc(d.sources?.outlines || "county building footprints")}. Roof planes and lines: ${esc(d.sources?.lidar || "LiDAR")}. Photo: ${esc(d.sources?.imagery || "aerial imagery")}. Changes after the ${esc(d.sources?.lidar_year || "LiDAR")} scan are not reflected. Verify on site before ordering material.</p>
      </div>
    </div>` : coverCard(d)}
    ${facetCard(d, "pitch")}
    ${facetCard(d, "area")}
    ${wallsCard(d)}
    ${elevationsCard(d)}
    ${yardCard(d)}`;
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(share); document.getElementById("copied").textContent = "Link copied. Anyone with it can view this report."; }
    catch (e) { prompt("Share link:", share); }
  });
})();

// ---------------------------------------------------------- facet diagrams
function frame(d, pad) {
  const xs = [], ys = [];
  d.structures.forEach((s) => s.outline.forEach((ring) => ring.forEach(([x, y]) => { xs.push(x); ys.push(y); })));
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const w = maxx - minx + pad * 2, h = maxy - miny + pad * 2;
  return { w, h, X: (x) => (x - minx + pad).toFixed(2), Y: (y) => (maxy - y + pad).toFixed(2), sc: Math.max(w, h) / 600 };
}
const PITCH_FILL = ["#e0f2fe", "#dcfce7", "#fef9c3", "#ffedd5", "#fce7f3", "#ede9fe", "#e2e8f0"];
function facetCard(d, mode) {
  const has = d.structures.some((s) => (s.facet_polys || []).length);
  if (!has) return "";
  const F = frame(d, 10), sc = F.sc;
  const pitches = [...new Set(d.structures.flatMap((s) => (s.facet_polys || []).map((f) => f.pitch)))].sort((a, b) => a - b);
  let svg = `<svg viewBox="0 0 ${F.w.toFixed(1)} ${F.h.toFixed(1)}" style="width:100%;max-height:560px" role="img" aria-label="Roof facets, ${mode === "pitch" ? "pitch" : "area"} of each">`;
  d.structures.forEach((st) => (st.facet_polys || []).forEach((f) => {
    const fill = mode === "pitch" ? PITCH_FILL[pitches.indexOf(f.pitch) % PITCH_FILL.length] : "#f1f5f9";
    f.poly.forEach((ring) => {
      svg += `<polygon points="${ring.map(([x, y]) => `${F.X(x)},${F.Y(y)}`).join(" ")}" fill="${fill}" stroke="#334155" stroke-width="${(0.9 * sc).toFixed(2)}" stroke-linejoin="round"/>`;
    });
  }));
  d.structures.forEach((st) => (st.facet_polys || []).forEach((f) => {
    const cx = +F.X(f.c[0]), cy = +F.Y(f.c[1]);
    const fs = (12 * sc).toFixed(2);
    if (mode === "pitch") {
      const label = f.pitch ? `${f.pitch}/12` : "Flat";
      svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" style="font-size:${fs}px;stroke-width:${(3 * sc).toFixed(2)}px" fill="#0f172a">${label}</text>`;
      if (f.down) {
        const L = 9 * sc, dx = f.down[0] * L, dy = -f.down[1] * L, y0 = cy + 9 * sc;
        svg += `<line x1="${(cx - dx / 2).toFixed(2)}" y1="${(y0 - dy / 2).toFixed(2)}" x2="${(cx + dx / 2).toFixed(2)}" y2="${(y0 + dy / 2).toFixed(2)}" stroke="#0f172a" stroke-width="${(1.2 * sc).toFixed(2)}" marker-end="url(#ah)"/>`;
      }
    } else {
      svg += `<text x="${cx}" y="${(cy - 6 * sc).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" style="font-size:${(13 * sc).toFixed(2)}px;stroke-width:${(3 * sc).toFixed(2)}px" fill="#0f172a">${f.label}</text>`;
      svg += `<text x="${cx}" y="${(cy + 8 * sc).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" style="font-size:${(10.5 * sc).toFixed(2)}px;stroke-width:${(3 * sc).toFixed(2)}px;font-weight:600" fill="#334155">${Math.round(f.area_sqft).toLocaleString()}</text>`;
    }
  }));
  svg = svg.replace(">", `><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs>`);
  svg += "</svg>";
  const table = mode === "area" ? `<div class="tablewrap"><table><thead><tr><th>Facet</th><th class="num">Pitch</th><th class="num">Area (sq ft)</th></tr></thead><tbody>
      ${d.structures.flatMap((st) => (st.facet_polys || []).map((f) => `<tr><td>${f.label}${d.structures.length > 1 ? ` <span class="muted small">${esc(st.name)}</span>` : ""}</td><td class="num">${f.pitch ? `${f.pitch}/12` : "Flat"}</td><td class="num">${Math.round(f.area_sqft).toLocaleString()}</td></tr>`)).join("")}
    </tbody></table></div>` : `<div class="legend">${pitches.map((p, i) => `<span><i class="sw2" style="background:${PITCH_FILL[i % PITCH_FILL.length]};height:12px;border:1px solid #94a3b8"></i>${p ? `${p}/12` : "Flat"}</span>`).join("")}<span>Arrows point downslope</span></div>`;
  return `<div class="card">
      <h2>${mode === "pitch" ? "Pitch diagram" : "Facet areas"}</h2>
      <p class="small muted" style="margin-top:-8px">${mode === "pitch" ? "Each roof facet's measured pitch (rise per 12 in.). North is up." : "Facets lettered smallest (A) to largest, with sloped area in sq ft. North is up."}</p>
      ${svg}${table}
    </div>`;
}

// ---------------------------------------------------------- elevations
function elevationsCard(d) {
  const E = d.walls && d.walls.elevations;
  if (!E || !Object.keys(E).length) return "";
  const sides = ["North", "East", "South", "West"].filter((s) => E[s]);
  const maxW = Math.max(...sides.flatMap((s) => E[s].flatMap((w) => w.pts.map((p) => p[0]))));
  const maxH = Math.max(...sides.flatMap((s) => E[s].flatMap((w) => w.pts.map((p) => p[1]))));
  const ftin = (v) => { const f = Math.floor(v + 1e-6), i = Math.round((v - f) * 12); return i === 12 ? `${f + 1}'` : i ? `${f}' ${i}"` : `${f}'`; };
  const svgFor = (side) => {
    const padX = 4, top = 4, bottom = 6, W = maxW + padX * 2, H = maxH + top + bottom, G = H - bottom;
    const fs = Math.max(1.1, W / 70);
    const T = (x, y, txt, o = {}) => `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="${o.a || "middle"}" style="font-size:${(o.s || fs).toFixed(2)}px;font-weight:${o.w || 600};stroke-width:${(fs * 0.28).toFixed(2)}px" fill="${o.c || "#334155"}">${txt}</text>`;
    let g = `<line x1="0" y1="${G}" x2="${W}" y2="${G}" stroke="#64748b" stroke-width="${(fs * 0.12).toFixed(2)}"/>`;
    let labels = "";
    const hidden = (i) => {  // mostly behind a nearer wall (drawn later)?
      const w = E[side][i], a0 = w.pts[0][0], a1 = w.pts[w.pts.length - 1][0];
      return E[side].slice(i + 1).some((o) => {
        const b0 = o.pts[0][0], b1 = o.pts[o.pts.length - 1][0];
        return Math.min(a1, b1) - Math.max(a0, b0) > 0.5 * (a1 - a0);
      });
    };
    E[side].forEach((w, wi) => {
      const pts = w.pts, x0 = pts[0][0] + padX, x1 = pts[pts.length - 1][0] + padX;
      const poly = [`${x0.toFixed(2)},${G}`, ...pts.map(([x, h]) => `${(x + padX).toFixed(2)},${(G - h).toFixed(2)}`), `${x1.toFixed(2)},${G}`].join(" ");
      g += `<polygon points="${poly}" fill="#f1f5f9" stroke="#1e293b" stroke-width="${(fs * 0.11).toFixed(2)}" stroke-linejoin="miter"/>`;
      const len = x1 - x0;
      if (len < 5 || hidden(wi)) return;  // too narrow, or behind another wall
      const hl = pts[0][1], hr = pts[pts.length - 1][1];
      const peak = pts.reduce((m, p) => (p[1] > m[1] ? p : m), pts[0]);
      // wall label in the middle, length under the ground line
      labels += T((x0 + x1) / 2, G - Math.min(hl, hr) / 2 + fs * 0.4, w.label, { c: "#b91c1c", w: 700 });
      labels += T((x0 + x1) / 2, G + fs * 1.5, ftin(w.length || len), { s: fs * 0.85, w: 500 });
      // eave heights at the corners; the peak if it's a gable
      if (len >= 8) {
        labels += T(x0 + fs * 0.4, G - hl + fs * 1.2, ftin(hl), { a: "start", s: fs * 0.8, w: 500, c: "#475569" });
        if (Math.abs(hr - hl) > 0.6) labels += T(x1 - fs * 0.4, G - hr + fs * 1.2, ftin(hr), { a: "end", s: fs * 0.8, w: 500, c: "#475569" });
      }
      if (peak[1] - Math.max(hl, hr) > 1.0) labels += T(peak[0] + padX, G - peak[1] - fs * 0.5, ftin(peak[1]), { s: fs * 0.8, w: 500, c: "#475569" });
    });
    return `<div class="tablewrap"><svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" style="width:100%;min-width:620px;max-height:260px" role="img" aria-label="${side} elevation">${g}${labels}</svg></div>`;
  };
  return `<div class="card">
      <h2>Elevations</h2>
      <p class="small muted" style="margin-top:-8px">Each side's walls as seen standing in front of it. Wall tops follow the measured roof planes; heights from the ground at that wall. Lengths along the bottom, eave and peak heights on the walls. Same scale for all sides.</p>
      ${sides.map((sd) => `<div style="margin-top:12px"><b>${sd}</b> <span class="muted small">${Math.round(d.walls.by_side[sd]).toLocaleString()} sq ft of wall</span>${svgFor(sd)}</div>`).join("")}
    </div>`;
}

// ---------------------------------------------------------- cover without roof
function coverCard(d) {
  const y = d.yard || {}, n = (v, u = "") => (v == null || v === "" ? "–" : `${Math.round(v).toLocaleString()}${u}`);
  const photo = y.photo_jpg || d.aerial_jpg;
  const LAB = { roof: "Roof", walls: "Walls & siding", elevations: "Elevations", yard: "Lot & yard" };
  return `<div class="cover">
      <div class="card">${photo ? `<img alt="Aerial photo of the property" src="data:image/jpeg;base64,${photo}">` : ""}</div>
      <div class="card">
        <div class="muted small">Property</div>
        <table class="kv" style="margin-top:6px">
          <tr><td>Lot</td><td>${n(y.lot_sqft, " sq ft")}</td></tr>
          <tr><td>House (assessor)</td><td>${n(y.living_sqft, " sq ft")}</td></tr>
          <tr><td>Year built</td><td>${esc(y.year_built || "–")}</td></tr>
          <tr><td>Assessed value</td><td>${y.home_value ? "$" + n(y.home_value) : "–"}</td></tr>
          ${d.walls && d.walls.stories ? `<tr><td>Stories (estimate)</td><td>${d.walls.stories}</td></tr>` : ""}
        </table>
        <div class="muted small" style="margin-top:12px">In this report: ${(d.sections || []).map((x) => esc(LAB[x] || x)).join(" · ")}</div>
      </div>
    </div>`;
}

// ---------------------------------------------------------- lot & yard
function yardCard(d) {
  const y = d.yard;
  if (!y || y.basic) return "";
  const n = (v) => (v == null ? "–" : Math.round(v).toLocaleString());
  const rows = [["#22c55e", "Lawn (grass only)", y.lawn_sqft], ["#86efac", "Parkway grass", y.parkway_sqft], ["#3b82f6", "Driveway", y.driveway_sqft],
    ["#ec4899", "Public sidewalk", y.sidewalk_sqft], ["#eab308", "Patios & walks", y.other_hardscape_sqft], ["#ef4444", "Decks, sheds, play sets", y.structures_sqft],
    ["#a855f7", "Landscape beds", y.beds_sqft], ["#64748b", "Buildings", y.building_sqft]];
  return `<div class="card">
      <h2>Lot &amp; yard</h2>
      <p class="small muted" style="margin-top:-8px">For lawn, snow, concrete and landscape work. Square feet.</p>
      <div class="cover">
        <div>${y.photo_jpg ? `<img alt="Aerial photo of the lot with lawn, driveway, sidewalk and beds shaded" src="data:image/jpeg;base64,${y.photo_jpg}">` : ""}</div>
        <div><table class="kv">
          ${rows.map(([c, k, v]) => `<tr><td><span class="sw2" style="background:${c};height:10px"></span>${k}</td><td>${n(v)}</td></tr>`).join("")}
          <tr><td>Trees on the lot</td><td>${y.tree_count ?? "–"}${y.tree_canopy_sqft ? ` · ${n(y.tree_canopy_sqft)} sq ft canopy` : ""}</td></tr>
          <tr><td>Street frontage</td><td>${n(y.frontage_ft)} ft</td></tr>
          <tr><td><b>Lot</b></td><td>${n(y.lot_sqft)}</td></tr>
        </table>
        ${y.quality === "review" ? `<p class="small" style="color:#8a5300">Some yard areas on this lot may need a quick check on site${y.note ? `: ${esc(y.note)}` : ""}.</p>` : ""}</div>
      </div>
    </div>`;
}

function tradeCard(t) {
  if (!t || !t.metrics || !t.metrics.length) return "";
  const v = (m) => m.unit === "$" ? "$" + Number(m.value).toLocaleString()
    : (typeof m.value === "number" ? m.value.toLocaleString() + (m.unit ? " " + m.unit : "") : esc(String(m.value)) + (m.unit ? " " + m.unit : ""));
  const shown = t.metrics.filter((m) => !m.beta);
  return `<div class="card">
      <div class="muted small">For ${esc(t.label)}</div>
      ${t.price ? `<div style="margin:4px 0 2px"><span class="big" style="font-size:26px">${esc(t.price.text.split(" ")[0])}</span> <span class="muted">${esc(t.price.label)} · your price</span></div>` : ""}
      <table class="kv" style="margin-top:6px">${shown.map((m) => `<tr><td>${esc(m.label)}</td><td>${v(m)}</td></tr>`).join("")}</table>
    </div>`;
}

function wallsCard(d) {
  const w = d.walls;
  if (!w) return "";
  const n = (v) => Math.round(v).toLocaleString();
  const sides = ["North", "East", "South", "West"];
  return `
    <div class="card">
      <h2>Walls &amp; exterior</h2>
      <p class="small muted" style="margin-top:-8px">For siding, gutter, trim and window work. Square feet unless noted.</p>
      <div class="grid2">
        <div>
          <table class="kv">
            <tr><td><b>Total wall area</b> (gross)</td><td>${n(w.gross_wall_sqft)} sq ft</td></tr>
            ${sides.map((s) => `<tr><td>${s} walls</td><td>${n(w.by_side[s])}</td></tr>`).join("")}
            <tr><td>Windows &amp; doors (estimate)</td><td>~${w.est_openings} · ~${n(w.est_opening_sqft)} sq ft</td></tr>
            <tr><td>Net wall area (estimate)</td><td>${n(w.est_net_wall_sqft)}</td></tr>
          </table>
        </div>
        <div>
          <table class="kv">
            <tr><td>Gutters (eaves)</td><td>${n(w.gutter_ft)} ft</td></tr>
            <tr><td>Downspouts (estimate)</td><td>${w.downspouts}</td></tr>
            <tr><td>Fascia (eaves + rakes)</td><td>${n(w.fascia_ft)} ft</td></tr>
            <tr><td>Soffit (at ${w.overhang_ft} ft overhang)</td><td>${n(w.soffit_sqft)}</td></tr>
            <tr><td>Outside corners</td><td>${n(w.outside_corners_ft)} ft</td></tr>
            <tr><td>Inside corners</td><td>${n(w.inside_corners_ft)} ft</td></tr>
          </table>
        </div>
      </div>
      <h2 style="margin-top:14px">Siding waste</h2>
      <table><thead><tr><th>Waste</th><th class="num">Area (sq ft)</th><th class="num">Squares</th></tr></thead><tbody>
      ${w.siding_squares.map((x) => `<tr><td>${x.pct}%</td><td class="num">${n(x.sqft)}</td><td class="num">${x.squares.toFixed(1)}</td></tr>`).join("")}
      </tbody></table>
      <p class="small muted">${esc(w.note)}</p>
    </div>`;
}

function diagram(d) {
  const xs = [], ys = [];
  d.structures.forEach((s) => s.outline.forEach((ring) => ring.forEach(([x, y]) => { xs.push(x); ys.push(y); })));
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const pad = 12, w = maxx - minx + pad * 2, h = maxy - miny + pad * 2;
  const X = (x) => (x - minx + pad).toFixed(2), Y = (y) => (maxy - y + pad).toFixed(2);
  let s = `<svg viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" style="width:100%;max-height:640px" role="img" aria-label="Roof length diagram">`;
  d.structures.forEach((st) => st.outline.forEach((ring) => {
    s += `<polygon points="${ring.map(([x, y]) => `${X(x)},${Y(y)}`).join(" ")}" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.4"/>`;
  }));
  const sc = Math.max(w, h) / 600;
  s += `<defs><pattern id="treeHatch" patternUnits="userSpaceOnUse" width="${(4 * sc).toFixed(2)}" height="${(4 * sc).toFixed(2)}" patternTransform="rotate(45)"><rect width="100%" height="100%" fill="#dcfce7" fill-opacity="0.5"/><line x1="0" y1="0" x2="0" y2="${(4 * sc).toFixed(2)}" stroke="#15803d" stroke-width="${(1.2 * sc).toFixed(2)}" stroke-opacity="0.6"/></pattern></defs>`;
  d.structures.forEach((st) => (st.tree_cover || []).forEach((ring) => {
    s += `<polygon points="${ring.map(([x, y]) => `${X(x)},${Y(y)}`).join(" ")}" fill="url(#treeHatch)" stroke="#15803d" stroke-width="${(0.6 * sc).toFixed(2)}"/>`;
  }));
  d.structures.forEach((st) => st.segments.forEach((g) => {
    s += `<line x1="${X(g.a[0])}" y1="${Y(g.a[1])}" x2="${X(g.b[0])}" y2="${Y(g.b[1])}" stroke="${COLORS[g.type]}" stroke-width="${(2.2 * sc).toFixed(2)}" stroke-linecap="round"${g.tree ? ` stroke-dasharray="${(5 * sc).toFixed(2)} ${(3 * sc).toFixed(2)}"` : ""}/>`;
  }));
  d.structures.forEach((st) => st.segments.forEach((g) => {
    if (g.len < 6) return;
    s += `<text x="${X((g.a[0] + g.b[0]) / 2)}" y="${Y((g.a[1] + g.b[1]) / 2)}" fill="${COLORS[g.type]}" text-anchor="middle" dominant-baseline="middle" style="font-size:${(11 * sc).toFixed(2)}px;stroke-width:${(3 * sc).toFixed(2)}px">${Math.round(g.len)}</text>`;
  }));
  return s + "</svg>";
}
</script>
