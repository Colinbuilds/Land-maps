<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Data Order</title>
<link rel="stylesheet" href="/static/styles.css?v=10">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><span id="bizName">Property Data</span></div>
  <div class="contact" id="bizContact"></div>
</header>
<main style="max-width:720px">
  <div class="card stack" id="box"><p class="muted"><span class="spinner"></span>Loading your order…</p></div>
  <p class="small muted">Keep this page's link: it's how you get back to your download.</p>
</main>
<script src="/static/common.js?v=22"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const oid = location.pathname.split("/").pop();
  const qs = new URLSearchParams(location.search);
  const t = qs.get("t"), sid = qs.get("session_id");
  const usd = (c) => "$" + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let first = true;
  async function load() {
    let o;
    try { o = await api(`/api/data/order/${oid}?t=${encodeURIComponent(t || "")}${first && sid ? `&session_id=${encodeURIComponent(sid)}` : ""}`); }
    catch (e) { $("box").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
    first = false;
    if (o.contact && o.contact.name) $("bizName").textContent = o.contact.name;
    $("bizContact").textContent = [o.contact?.phone, o.contact?.email].filter(Boolean).join(" · ");
    const head = `<div class="muted small">Order ${esc(o.id)} · ${esc(o.email)}</div>
      <h1 style="margin:0">ZIP ${esc(o.zip)}: ${o.count.toLocaleString()} properties</h1>
      <div class="muted">${usd(o.amount_cents)}${(o.type_labels || []).length ? ` · ${(o.type_labels || []).map(esc).join(", ")}` : ""}</div>`;
    let body = "";
    if (o.status === "awaiting_payment") {
      body = o.stripe
        ? `<p>Your order is saved but not paid yet.</p><button id="pay">Pay ${usd(o.amount_cents)} by card</button>`
        : `<p><b>We've got your order.</b> We'll email an invoice to ${esc(o.email)}. As soon as it's paid, your sheet is measured and this page updates with the download.</p>
           <p class="small muted">Questions: ${esc([o.contact?.phone, o.contact?.email].filter(Boolean).join(" · ") || "reply to the invoice email")}</p>`;
    } else if (o.status === "processing") {
      const p = o.progress || {};
      const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
      body = `<p><b>Paid, thank you.</b> We're measuring every property in the ZIP now${p.total ? ` (${p.done.toLocaleString()} of ${p.total.toLocaleString()})` : ""}. This page updates by itself.</p>
        <div class="progress"><div style="width:${pct}%"></div></div>`;
      setTimeout(load, 5000);
    } else if (o.status === "ready") {
      const prem = o.product === "premier";
      body = prem
        ? `<p><b>Your Premier list is ready.</b> One folder: a full report PDF for every home, named by address, with an index spreadsheet (owner names included).</p>
           <a class="btn" href="/api/data/order/${esc(o.id)}/csv?t=${encodeURIComponent(t)}">Download folder (.zip)</a>
           <div class="card stack" style="margin-top:16px;background:var(--field,#f3f5f0)">
             <h2 style="margin:0">Postcards for door-to-door mail</h2>
             <p class="small muted" style="margin:0">Print-ready 9 x 6 in postcards (1/8 in bleed) for every home: the aerial photo, its measurements, the owner's name and <b>your price</b> from the prices in your account. You handle printing and postage. Also includes every photo and a mail-merge spreadsheet for your own design.</p>
             <div class="row" style="flex-wrap:wrap">
               <select id="mTrade" aria-label="Trade"></select>
               <input id="mName" placeholder="Company name (default: your account)">
               <input id="mPhone" placeholder="Phone (default: your account)" inputmode="tel">
             </div>
             <input id="mHead" placeholder="Headline (optional), e.g. Your yard, measured." maxlength="90">
             <input id="mOffer" placeholder="Back message (optional)" maxlength="220">
             <div class="row"><button id="mBuild" style="flex:0 0 auto">Make postcards</button></div>
             <div id="mMsg" class="small"></div>
           </div>`
        : `<p><b>Your sheet is ready.</b> One row per property, with the owner's name and your price for each home when your account has prices set.</p>
        <a class="btn" href="/api/data/order/${esc(o.id)}/csv?t=${encodeURIComponent(t)}">Download CSV</a>`;
    }
    $("box").innerHTML = head + body;
    if (document.getElementById("mBuild")) wireMail(o);
    const pay = document.getElementById("pay");
    if (pay) pay.addEventListener("click", async () => {
      pay.disabled = true;
      try { const r = await api(`/api/data/order/${oid}/checkout?t=${encodeURIComponent(t)}`, { method: "POST" }); location.href = r.checkout_url; }
      catch (e) { pay.disabled = false; alert(e.message); }
    });
  }
  async function wireMail(o) {
    let TR = [];
    try { TR = (await api("/api/trades")).trades.filter((x) => !/beta/i.test(x.label)); } catch (e) {}
    $("mTrade").innerHTML = TR.map((x) => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("");
    const q = `?t=${encodeURIComponent(t)}`;
    const show = (j) => {
      if (j.status === "building") {
        const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
        $("mMsg").innerHTML = `<span class="spinner"></span>Making postcards${j.total ? ` (${j.done.toLocaleString()} of ${j.total.toLocaleString()})` : ""}…<div class="progress"><div style="width:${pct}%"></div></div>`;
        setTimeout(poll, 3000);
      } else if (j.status === "ready") {
        $("mMsg").innerHTML = `<a class="btn" href="/api/data/order/${esc(o.id)}/mailing.zip${q}">Download postcards (${(j.homes || 0).toLocaleString()} homes)</a>`;
      } else if (j.status === "failed") {
        $("mMsg").innerHTML = `<span class="err">${esc(j.error || "Something went wrong.")}</span>`;
      }
    };
    const poll = async () => { try { show(await api(`/api/data/order/${o.id}/mailing${q}`)); } catch (e) {} };
    $("mBuild").addEventListener("click", async () => {
      $("mMsg").innerHTML = '<span class="spinner"></span>Starting…';
      try {
        show(await api(`/api/data/order/${o.id}/mailing${q}`, { method: "POST", json: {
          trade: $("mTrade").value, name: $("mName").value.trim() || null, phone: $("mPhone").value.trim() || null,
          headline: $("mHead").value.trim() || null, offer: $("mOffer").value.trim() || null } }));
      } catch (e) { $("mMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    });
    poll();
  }
  load();
})();
</script>
</body>
</html>
