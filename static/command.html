<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/styles.css?v=22">
<style>
  body { background: #f3f4f1; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 16px 60px; }
  h1 { margin: 6px 0 2px; }
  .tot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
  @media (min-width: 760px) { .tot { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  .tot div { background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .tot .l { font-size: 12px; color: var(--muted); } .tot .v { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tools input { max-width: 320px; min-height: 42px; }
  .tools select { max-width: 200px; min-height: 42px; }
  .chip { background: #e9efeb; color: var(--ink); border-radius: 99px; padding: 7px 13px; font-size: 13.5px; min-height: 36px; }
  .chip.on { background: var(--ink); color: #fff; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .co { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; display: grid; gap: 6px; border: 2px solid transparent; }
  .co:hover { border-color: #cbd5e1; }
  .co .hd { display: flex; gap: 8px; align-items: center; }
  .co .hd i { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .co .hd b { font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .co .txt { font-size: 13.5px; color: #334155; }
  .co .nums { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .co .nums b { color: var(--ink); }
  .flag { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 2px 8px; margin: 0 4px 2px 0; }
  .flag.warn { background: #fef3c7; color: #92400e; } .flag.bad { background: #fee2e2; color: #991b1b; }
  .tag { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 2px 8px; background: #dcfce7; color: #166534; }
  .tag.crm { background: #e0ecff; color: #1d4ed8; } .tag.payg { background: #f1f5f9; color: #475569; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 50; display: flex; justify-content: flex-end; }
  .drawer { background: #f8faf9; width: min(680px, 100%); height: 100%; overflow: auto; padding: 18px; }
  .drawer h2 { font-size: 22px; margin: 0; }
  .box { background: #fff; border-radius: 14px; padding: 14px; margin-top: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .box h3 { margin: 0 0 8px; font-size: 15px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .tchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchips button { background: #eef2f7; color: var(--ink); border-radius: 99px; padding: 6px 11px; font-size: 13px; }
  .tchips button.on { background: var(--accent); color: #fff; }
  table.t { width: 100%; font-size: 13.5px; border-collapse: collapse; }
  table.t td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  /* live multiscreen */
  #tabStatus { max-width: 1500px; }
  .screens { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .scr { background: #0f172a; color: #e2e8f0; border-radius: 16px; padding: 14px 16px; min-height: 180px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .scr.big { grid-column: span 2; } @media (max-width: 760px) { .scr.big { grid-column: auto; } }
  .scr h3 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
  .scr h3 a { margin-left: auto; color: #7dd3fc; font-size: 12px; text-transform: none; letter-spacing: 0; text-decoration: none; }
  .scr .live { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
  .scr .live.on { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .scr .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
  .scr .nums div { background: #1e293b; border-radius: 10px; padding: 7px 9px; }
  .scr .nums .l { font-size: 11px; color: #94a3b8; } .scr .nums .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: #f8fafc; }
  .scr .row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
  .scr .row b { color: #f8fafc; font-variant-numeric: tabular-nums; }
  .scr .dim { color: #94a3b8; font-size: 12.5px; }
  .scr .bar { height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; }
  .scr .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 99px; transition: width .6s; }
  .scr .bar.amber i { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .scr .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .scr .chips span { background: #1e293b; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .scr .bad { color: #fca5a5; } .scr .ok { color: #86efac; }
  .scr button.mini { background: #334155; color: #e2e8f0; padding: 4px 10px; min-height: 0; font-size: 12px; border-radius: 99px; }
  .scr button.go { background: #16a34a; color: #fff; padding: 6px 14px; min-height: 0; font-size: 13px; border-radius: 99px; }
  .scr .empty { color: #64748b; font-size: 13px; }
  .hidden { display: none !important; }
  #tabFrame iframe { display: block; width: 100%; height: calc(100vh - 64px); border: 0; background: #f3f4f1; }
  @media (max-width: 760px) { #tabFrame iframe { height: calc(100vh - 64px - 70px); } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Command Center</div>
  <div class="contact"><a href="/" class="small" target="_blank">Customer site ↗</a></div>
</header>
<section id="tabFrame" class="hidden"><iframe id="frame" title="Command center section"></iframe></section>
<div class="wrap hidden" id="tabStatus">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h1>Live</h1><span class="small muted" id="stUpd"></span></div>
  <div id="stKey" class="card stack hidden" style="max-width:420px"><b>Owner access</b><input id="stTok" type="password" placeholder="Admin key"><button id="stGo">Open</button></div>
  <div class="screens" id="screens"></div>
</div>
<div class="wrap hidden" id="tabCompanies">
  <div id="tokBox" class="card stack hidden" style="max-width:420px">
    <b>Owner access</b><input id="tok" type="password" placeholder="Admin token (ESTIMATOR_ADMIN_TOKEN)"><button id="tokGo">Open</button><div id="tokMsg" class="small"></div>
  </div>
  <div id="app" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Your companies</h1><div class="acts"><button class="secondary" id="tryIt">Try the customer site</button><button id="addCo">+ Add company</button></div></div>
    <div class="muted" id="when"></div>
    <div class="tot" id="tot"></div>
    <div class="tools">
      <input id="q" placeholder="Search name, email, trade, notes" aria-label="Search">
      <span id="filters"></span>
      <select id="sort" aria-label="Sort"><option value="mrr">Most revenue</option><option value="active">Recently active</option><option value="new">Newest</option><option value="name">Name</option><option value="flags">Needs attention</option></select>
    </div>
    <div class="lib" id="lib"></div>
  </div>
</div>
<script src="/static/common.js?v=28"></script>
<script>
// one page, a tab per section: #companies (here), the rest open inside
(function () {
  const PAGES = { data: "/command/data", postcards: "/command/postcards", safety: "/command/safety", coverage: "/command/coverage", map: "/command/map", measure: "/command/tools",
                  demo: "/demo", settings: "/command/settings" };
  const TITLES = { status: "Live", companies: "Companies", data: "ZIP data", postcards: "Postcard studio", safety: "Safety", coverage: "Coverage", map: "ZIP map", measure: "Measure tools", demo: "Demo", settings: "Settings" };
  const loaded = {};
  function show() {
    let tab = (location.hash || "#status").slice(1);
    if (tab === "marketing") tab = "status";
    const page = PAGES[tab];
    document.getElementById("tabCompanies").classList.toggle("hidden", tab !== "companies");
    document.getElementById("tabStatus").classList.toggle("hidden", tab !== "status");
    window.dispatchEvent(new CustomEvent("cc-tab", { detail: tab }));
    document.getElementById("tabFrame").classList.toggle("hidden", !page);
    if (page) {
      const f = document.getElementById("frame");
      if (f.dataset.tab !== tab) { f.dataset.tab = tab; f.src = page; }
    }
    document.querySelector("header.top .brand").lastChild.textContent = TITLES[tab] ? ` Command Center · ${TITLES[tab]}` : " Command Center";
    document.querySelectorAll(".site-nav a, .tabbar a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "/command#" + tab));
    scrollTo(0, 0);
  }
  addEventListener("hashchange", show);
  if (document.readyState === "loading") addEventListener("DOMContentLoaded", show); else show();
})();
(async function () {
  const $ = (id) => document.getElementById(id);
  const usd = (c) => "$" + Math.round((c || 0) / 100).toLocaleString();
  const ago = (t) => { if (!t) return "never"; const d = (Date.now() / 1000 - t) / 86400; return d < 1 ? "today" : d < 2 ? "yesterday" : d < 30 ? `${Math.floor(d)} days ago` : new Date(t * 1000).toLocaleDateString(); };
  let L = null, TR = [], filter = "all";
  try { TR = (await api("/api/trades")).trades; } catch (e) {}
  const tl = (k) => ((TR.find((t) => t.key === k) || {}).label || k).replace(" (beta)", "");

  async function load() {
    try { L = await api("/api/admin/library"); }
    catch (e) {
      $("tokBox").classList.remove("hidden"); $("app").classList.add("hidden");
      $("tokMsg").textContent = /401|403|token|Forbidden|Unauthorized/i.test(e.message) ? "" : e.message; return;
    }
    $("tokBox").classList.add("hidden"); $("app").classList.remove("hidden");
    const t = L.totals;
    $("when").textContent = `Updated ${new Date().toLocaleTimeString()}`;
    $("tot").innerHTML = [["Companies", t.companies], ["Members", t.members], ["With CRM", t.crm], ["Monthly revenue", usd(t.mrr_cents)],
      ["ZIP list sales", usd(t.orders_cents)], ["Reports (30 days)", t.reports_30d.toLocaleString()], ["Need attention", t.flagged]]
      .map(([l, v]) => `<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
    $("filters").innerHTML = [["all", "All"], ["member", "Members"], ["crm", "CRM"], ["payg", "Pay as you go"], ["flag", "Needs attention"], ["paused", "Paused"]]
      .map(([k, l]) => `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("");
    draw();
  }
  $("tryIt").onclick = () => {
    const bg = document.createElement("div");
    bg.className = "drawer-bg"; bg.id = "dr";
    bg.innerHTML = `<div class="drawer"><div class="acts" style="justify-content:space-between"><h2>Try the customer site</h2><button class="secondary" id="tx">Close</button></div>
      <p class="muted">See exactly what a company sees. This signs this browser in to your private test company (not in your list, never billed). Log out on the customer site to end it.</p>
      <div class="box stack">
        <div><div class="small muted" style="margin-bottom:6px">Be a company in these trades</div><div class="tchips" id="tTr">${TR.map((t) => `<button data-k="${t.key}" class="${t.key === "lawn" ? "on" : ""}">${esc(tl(t.key))}</button>`).join("")}</div></div>
        <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tMem" checked style="width:auto"> Member (unlimited reports). Off = pay as you go with 5 credits</label>
        <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tCrm" checked style="width:auto"> CRM portal on</label>
        <div class="acts"><button id="tGo">Open the customer site</button><button class="secondary" id="tGoCrm">Open straight to the CRM</button></div>
        <div id="tMsg" class="small"></div>
      </div></div>`;
    document.body.appendChild(bg);
    const shut = () => bg.remove();
    bg.onclick = (e) => { if (e.target === bg) shut(); };
    $("tx").onclick = shut;
    const picked = new Set(["lawn"]);
    $("tTr").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; picked.has(k) ? picked.delete(k) : picked.add(k); b.classList.toggle("on"); };
    const go = (where) => async () => {
      if (!picked.size) { $("tMsg").innerHTML = '<span class="err">Pick at least one trade.</span>'; return; }
      try {
        await api("/api/admin/test-drive", { method: "POST", json: { trades: [...picked], member: $("tMem").checked, crm: $("tCrm").checked } });
        window.open(where, "_blank"); shut();
      } catch (e) { $("tMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    $("tGo").onclick = go("/");
    $("tGoCrm").onclick = go("/crm");
  };
  $("addCo").onclick = () => {
    const bg = document.createElement("div");
    bg.className = "drawer-bg"; bg.id = "dr";
    bg.innerHTML = `<div class="drawer"><div class="acts" style="justify-content:space-between"><h2>Add a company</h2><button class="secondary" id="ax">Close</button></div>
      <div class="box stack">
        <input id="aName" placeholder="Company name"><input id="aEmail" type="email" placeholder="Login email">
        <input id="aPhone" placeholder="Phone (optional)"><input id="aPass" type="text" placeholder="Temporary password (8+ characters)" value="${Math.random().toString(36).slice(2, 10)}A1">
        <div><div class="small muted" style="margin-bottom:6px">Trades</div><div class="tchips" id="aTr">${TR.map((t) => `<button data-k="${t.key}">${esc(tl(t.key))}</button>`).join("")}</div></div>
        <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="aCrm" checked style="width:auto"> CRM portal on</label>
        <select id="aComp"><option value="0">No free membership (they pay at /join)</option><option value="1">Free membership: 1 month</option><option value="3">Free membership: 3 months</option><option value="12">Free membership: 12 months</option></select>
        <input id="aCred" type="number" placeholder="Report credits to give (optional)">
        <button id="aGo">Create company</button><div id="aMsg" class="small"></div>
        <p class="small muted">Send them the login email and temporary password. They sign in at <b>/reports</b> or <b>/crm</b>.</p>
      </div></div>`;
    document.body.appendChild(bg);
    const shut = () => bg.remove();
    bg.onclick = (e) => { if (e.target === bg) shut(); };
    $("ax").onclick = shut;
    const picked = new Set();
    $("aTr").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; picked.has(k) ? picked.delete(k) : picked.add(k); b.classList.toggle("on"); };
    $("aGo").onclick = async () => {
      try {
        const c = await api("/api/admin/companies", { method: "POST", json: { name: $("aName").value.trim(), email: $("aEmail").value.trim(),
          password: $("aPass").value, phone: $("aPhone").value.trim(), credits: +$("aCred").value || 0 } });
        const body = { trades: [...picked], crm: $("aCrm").checked };
        if (+$("aComp").value) body.comp_months = +$("aComp").value;
        await api(`/api/admin/companies/${c.id}/manage`, { method: "PATCH", json: body });
        shut(); await load(); open(c.id);
      } catch (e) { $("aMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  };
  $("tokGo").onclick = () => { localStorage.setItem("adminToken", $("tok").value.trim()); load(); };
  $("filters").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; load(); } });
  $("q").oninput = draw; $("sort").onchange = draw;

  function draw() {
    if (!L) return;
    const q = $("q").value.trim().toLowerCase();
    let rows = L.companies.filter((c) => {
      if (filter === "member" && !c.member) return false;
      if (filter === "crm" && !(c.crm && c.member)) return false;
      if (filter === "payg" && c.member) return false;
      if (filter === "flag" && !c.summary.flags.length) return false;
      if (filter === "paused" && !c.disabled) return false;
      if (!q) return true;
      return `${c.name} ${c.email} ${c.phone} ${(c.trades || []).map(tl).join(" ")} ${c.admin_notes || ""}`.toLowerCase().includes(q);
    });
    const s = $("sort").value;
    rows.sort((a, b) => s === "name" ? a.name.localeCompare(b.name) : s === "new" ? b.created - a.created
      : s === "active" ? (b.summary.last_active || 0) - (a.summary.last_active || 0) : s === "flags" ? b.summary.flags.length - a.summary.flags.length
      : (b.summary.mrr_cents + b.summary.orders_cents) - (a.summary.mrr_cents + a.summary.orders_cents));
    $("lib").innerHTML = rows.map((c) => `<div class="co" data-id="${c.id}" tabindex="0">
        <div class="hd"><i style="background:${esc(c.brand_color || "#64748b")}"></i><b>${esc(c.name)}</b>
          ${c.member ? `<span class="tag">Member</span>` : `<span class="tag payg">Credits</span>`}${c.crm && c.member ? '<span class="tag crm">CRM</span>' : ""}</div>
        <div>${c.summary.flags.map((f) => `<span class="flag ${f.level}">${esc(f.text)}</span>`).join("")}</div>
        <div class="txt">${esc(c.summary.text)}</div>
        <div class="nums"><span><b>${usd(c.summary.mrr_cents)}</b>/mo</span><span><b>${(c.stats || {}).reports_30d || 0}</b> reports 30d</span><span>active ${ago(c.summary.last_active)}</span></div>
      </div>`).join("") || '<div class="muted">No companies match.</div>';
    $("lib").querySelectorAll(".co").forEach((el) => { el.onclick = () => open(+el.dataset.id); el.onkeydown = (e) => { if (e.key === "Enter") open(+el.dataset.id); }; });
  }

  async function open(id) {
    const d = await api(`/api/admin/companies/${id}/detail`);
    const c = d.company;
    let trades = (c.trades || []).slice();
    const bg = document.createElement("div");
    bg.className = "drawer-bg"; bg.id = "dr";
    bg.innerHTML = `<div class="drawer">
      <div class="acts" style="justify-content:space-between"><h2>${esc(c.name)}</h2><button class="secondary" id="dx">Close</button></div>
      <div>${d.summary.flags.map((f) => `<span class="flag ${f.level}">${esc(f.text)}</span>`).join("")}</div>
      <p style="margin:6px 0">${esc(d.summary.text)}</p>
      <div class="acts"><button id="dView">Open their portal</button><a class="btn secondary" href="mailto:${esc(c.email)}">Email</a>${c.phone ? `<a class="btn secondary" href="tel:${esc(c.phone)}">Call</a>` : ""}</div>
      <div class="box"><h3>Account</h3><div class="kv">
        <span>Email</span><span>${esc(c.email)}</span><span>Phone</span><span>${esc(c.phone || "–")}</span>
        <span>Plan</span><span>${c.member ? `Member until ${new Date(c.member_until * 1000).toLocaleDateString()}` : "Pay as you go"}</span>
        <span>Price if member</span><span>${usd(d.plan_price_cents)}/mo</span>
        <span>Credits</span><span>${c.credits}</span><span>Joined</span><span>${new Date(c.created * 1000).toLocaleDateString()}</span>
        <span>Last active</span><span>${ago(d.summary.last_active)}</span><span>Stripe</span><span>${c.stripe_sub ? "subscribed" : "–"}</span></div></div>
      <div class="box"><h3>Trades</h3><div class="tchips" id="dTr">${TR.map((t) => `<button data-k="${t.key}" class="${trades.includes(t.key) ? "on" : ""}">${esc(tl(t.key))}</button>`).join("")}</div>
        <div class="small muted" style="margin-top:6px">Changing trades here doesn't change their Stripe price; it's for fixing a mix-up or a comped account.</div></div>
      <div class="box"><h3>Manage</h3>
        <div class="acts">
          <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dCrm" ${c.crm ? "checked" : ""} style="width:auto"> CRM portal</label>
          <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dPause" ${c.disabled ? "checked" : ""} style="width:auto"> Paused (can't sign in)</label>
        </div>
        <div class="row" style="margin-top:10px"><select id="dComp"><option value="">Comp a membership…</option><option value="1">Free for 1 month</option><option value="3">Free for 3 months</option><option value="12">Free for 12 months</option><option value="0">End membership now</option></select>
          <input type="number" id="dCred" placeholder="Add credits (e.g. 5)"></div>
        <label class="small muted" style="display:block;margin-top:10px">Your notes on this company (only you see these)<textarea id="dNotes">${esc(c.admin_notes || "")}</textarea></label>
        <button id="dSave" style="margin-top:10px">Save changes</button> <span id="dMsg" class="small"></span></div>
      ${d.money ? `<div class="box"><h3>Their CRM</h3><div class="kv"><span>Customers</span><span>${d.crm_stats.customers}</span><span>Active jobs</span><span>${d.crm_stats.jobs}</span>
        <span>Collected this month</span><span>${usd(d.money.paid_this_month)}</span><span>Owed to them</span><span>${usd(d.money.owed)}</span>
        <span>Open estimates</span><span>${usd(d.money.pipeline)}</span><span>Collected all time</span><span>${usd(d.crm_stats.paid_cents)}</span></div></div>` : ""}
      <div class="box"><h3>Reports (${d.stats.reports || 0})</h3><table class="t">${d.reports.map((r) => `<tr><td>${new Date(r.created * 1000).toLocaleDateString()}</td><td>${esc(r.address)}</td><td><a href="/r/${r.id}?t=${esc(r.share_token)}" target="_blank">open</a></td></tr>`).join("") || '<tr><td class="muted">None yet</td></tr>'}</table></div>
      <div class="box"><h3>ZIP orders</h3><table class="t">${d.orders.map((o) => `<tr><td>${new Date(o.created * 1000).toLocaleDateString()}</td><td>ZIP ${esc(o.zip)} · ${esc(o.product || "standard")}</td><td>${usd(o.amount_cents)}</td><td>${esc(o.status.replace("_", " "))}</td></tr>`).join("") || '<tr><td class="muted">None</td></tr>'}</table></div>
      <div class="box"><h3>Credit history</h3><table class="t">${d.ledger.map((l) => `<tr><td>${new Date(l.ts * 1000).toLocaleDateString()}</td><td>${esc(l.reason)}</td><td>${l.delta > 0 ? "+" : ""}${l.delta}</td></tr>`).join("") || '<tr><td class="muted">None</td></tr>'}</table></div>
    </div>`;
    document.body.appendChild(bg);
    const shut = () => bg.remove();
    bg.onclick = (e) => { if (e.target === bg) shut(); };
    $("dx").onclick = shut;
    $("dTr").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k;
      trades = trades.includes(k) ? trades.filter((x) => x !== k) : [...trades, k]; b.classList.toggle("on"); };
    $("dView").onclick = async () => {
      if (!confirm(`Open ${c.name}'s portal as them? You'll be signed in as this company in this browser for a day.`)) return;
      const r = await api(`/api/admin/companies/${id}/view-as`, { method: "POST" }); window.open(r.go, "_blank");
    };
    $("dSave").onclick = async () => {
      try {
        const body = { trades, crm: $("dCrm").checked, disabled: $("dPause").checked, admin_notes: $("dNotes").value };
        if ($("dComp").value !== "") body.comp_months = +$("dComp").value;
        await api(`/api/admin/companies/${id}/manage`, { method: "PATCH", json: body });
        const cr = +$("dCred").value;
        if (cr) await api(`/api/admin/companies/${id}/credits`, { method: "POST", json: { delta: cr, reason: "added by owner" } });
        shut(); await load(); open(id);
      } catch (e) { $("dMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  load();
})();
</script>
<script>
// Live: every moving part on one wall of screens, refreshed every 5 seconds
(function () {
  const $ = (id) => document.getElementById(id);
  const usd = (c) => "$" + Math.round((c || 0) / 100).toLocaleString();
  const n = (v) => (v || 0).toLocaleString();
  const ago = (t) => { if (!t) return "—"; const s = Date.now() / 1000 - t; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago"; };
  const dur = (s) => s == null ? "—" : s < 90 ? Math.round(s) + " s" : s < 5400 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
  const pct = (a, b) => b ? Math.min(100, Math.round(100 * a / b)) : 0;
  const bar = (a, b, cls = "") => `<div class="bar ${cls}"><i style="width:${pct(a, b)}%"></i></div>`;
  const nums = (arr) => `<div class="nums">${arr.map(([l, v, c]) => `<div><div class="l">${l}</div><div class="v ${c || ""}">${v}</div></div>`).join("")}</div>`;
  const head = (t, live, link) => `<h3><span class="live ${live ? "on" : ""}"></span>${t}${link ? `<a href="/command#${link}">Open →</a>` : ""}</h3>`;
  let timer = null, on = false;

  function render(S) {
    const P = S.prebuild, M = S.measuring, Sh = S.sheets, O = S.orders, D = S.downloads, C = S.coverage, Co = S.companies, Y = S.system;
    const scr = [];
    // 1. ZIPs measuring right now
    scr.push(`<div class="scr big">${head("ZIPs measuring now", M.length, "data")}
      ${M.length ? M.map((j) => `<div><div class="row"><b>${j.zip}</b><span>${j.stage === "measuring" ? `${n(j.done)} of ${n(j.total)} homes` : esc(j.stage)}</span>
        <span class="dim">${j.per_min ? j.per_min + "/min · " + dur(j.eta_s) + " left" : ""}</span></div>${bar(j.done, j.total)}
        ${j.errors ? `<div class="dim bad">${j.errors} homes couldn't be measured</div>` : ""}</div>`).join("")
        : '<div class="empty">Nothing measuring. Start the queue below, or buyers will start one when they order.</div>'}
      <div style="margin-top:auto">
        <div class="row"><b>Queue</b><span>${n(P.done)} of ${n(P.total)} ZIPs done${P.failed ? ` · <span class="bad">${P.failed} failed</span>` : ""}</span>
          <span>${P.running ? '<button class="mini" data-act="stop">Stop</button>' : '<button class="go" data-act="start">Measure all ZIPs</button>'}</span></div>
        ${bar(P.done, P.total)}
        ${P.next.length ? `<div class="dim" style="margin-top:6px">Up next</div><div class="chips">${P.next.map((z) => `<span>${z}</span>`).join("")}</div>` : ""}
      </div></div>`);
    // 2. downloads
    scr.push(`<div class="scr">${head("Downloads", D.recent.length && Date.now() / 1000 - D.recent[0].ts < 600)}
      ${nums([["Today", n(D.today)], ["This week", n(D.week)]])}
      ${D.recent.slice(0, 6).map((d) => `<div class="row"><b>${d.zip}</b><span>${d.kind === "premier" ? "Premier folder" : "Spreadsheet"}</span><span class="dim">${ago(d.ts)}</span></div>`).join("")
        || '<div class="empty">No downloads yet.</div>'}</div>`);
    // 3. orders
    scr.push(`<div class="scr">${head("ZIP orders", O.processing.length, "data")}
      ${nums([["Paid today", n(O.paid_today)], ["Sales today", usd(O.cents_today)], ["Unpaid", n(O.awaiting)]])}
      ${O.processing.length ? '<div class="dim">Getting ready for the buyer</div>' + O.processing.slice(0, 5).map((o) => { const p = o.progress || {};
          return `<div><div class="row"><b>${o.zip}</b><span>${o.product === "premier" ? "Premier" : "Sheet"} · ${esc(o.company)}</span><span class="dim">${p.total ? pct(p.done, p.total) + "%" : p.status === "building" ? "starting" : "queued"}</span></div>${bar(p.done, p.total, "amber")}</div>`; }).join("")
        : O.recent.slice(0, 5).map((o) => `<div class="row"><b>${o.zip}</b><span>${usd(o.amount_cents)} · ${o.status === "ready" ? '<span class="ok">ready</span>' : esc(o.status)}</span><span class="dim">${ago(o.paid || o.created)}</span></div>`).join("")
          || '<div class="empty">No orders yet.</div>'}</div>`);
    // 4. ready to sell
    scr.push(`<div class="scr">${head("Ready to sell", false, "data")}
      ${nums([["ZIPs ready", n(Sh.ready_total)], ["Homes", n(Sh.homes)], ["Done today", n(Sh.today)]])}
      ${Sh.ready.slice(0, 4).map((r) => `<div class="row"><b>${r.zip}</b><span>${n(r.count)} homes${r.errors ? ` · ${r.errors} missed` : ""}${r.skipped && r.skipped.length ? ` · <span class="bad">no ${esc(r.skipped.join(", "))}</span>` : ""}</span><span class="dim">${ago(r.finished)}</span></div>`).join("")}
      ${Sh.failed_total ? `<div class="dim bad" style="margin-top:4px">${Sh.failed_total} failed</div>` + Sh.failed.slice(0, 3).map((r) => `<div class="row"><b>${r.zip}</b><span class="bad">failed ${ago(r.finished)}</span><span><button class="mini" data-retry="${r.zip}">Retry</button></span></div>`).join("") : ""}</div>`);
    // 5. coverage
    const by = C.by_status || {};
    scr.push(`<div class="scr">${head("Coverage", C.running, "coverage")}
      ${nums([["Metros mapped", `${n(C.mapped)}<span class="dim" style="font-size:13px"> / ${n(C.metros)}</span>`], ["Counties live", n(by.live)], ["ZIPs", n(C.zips)]])}
      <div class="chips">${Object.entries(by).map(([k, v]) => `<span>${esc(k)} ${n(v)}</span>`).join("")}</div>
      <div class="dim">${C.running ? "▶ " + esc(C.now || "Working") : "Idle. Runs again tonight."}</div></div>`);
    // 6. companies
    scr.push(`<div class="scr">${head("Companies", Co.active_today, "companies")}
      ${nums([["Companies", n(Co.total)], ["Members", n(Co.members)], ["Active today", n(Co.active_today)], ["Reports today", n(Co.reports_today)]])}
      <div class="dim">${n(Co.reports_30d)} reports in the last 30 days</div></div>`);
    // 7. learning from people's fixes
    const Lr = S.learning || { lawn: [], roof: [], fixes: 0, roof_edits: 0 };
    const cname = (c) => esc(String(c).replace(/_([a-z]{2})$/, (m, st) => ", " + st.toUpperCase()).replace(/_/g, " ").replace(/\b\w/g, (x) => x.toUpperCase()));
    scr.push(`<div class="scr">${head("Learning from fixes", Lr.fixes + Lr.roof_edits > 0, "measure")}
      ${nums([["Lawn fixes", n(Lr.fixes)], ["Roof edits", n(Lr.roof_edits)], ["Counties using it", n(Lr.lawn.filter((r) => r.active).length)]])}
      ${Lr.lawn.slice(0, 4).map((r) => `<div class="row"><b style="font-size:12px">${cname(r.county)}</b><span>${n(r.n)} fix${r.n === 1 ? "" : "es"}</span><span class="${r.active ? "ok" : "dim"}">${r.active ? "in use" : `${3 - r.n} more to start`}</span></div>`).join("")}
      ${Lr.roof.slice(0, 3).map((r) => `<div class="row"><b style="font-size:12px">${cname(r.county)}</b><span>${n(r.n)} roof edits · outlines ${r.ratio > 1.03 ? "too small" : r.ratio < 0.97 ? "too big" : "right size"}</span><span class="dim">${r.shift_ft[0] || r.shift_ft[1] ? `nudged ${Math.hypot(...r.shift_ft).toFixed(1)} ft` : ""}</span></div>`).join("")}
      ${Lr.fixes + Lr.roof_edits ? "" : '<div class="empty">Every lawn fix in Measure tools and every roof outline a company adjusts teaches the measuring for that county.</div>'}</div>`);
    // 7b. server
    const dk = Y.disk || {};
    scr.push(`<div class="scr">${head("Server", true, "safety")}
      ${nums([["Memory", Y.memory_mb != null ? Y.memory_mb + " MB" : "—"], ["Disk free", dk.free_gb != null ? dk.free_gb + " GB" : "—", dk.free_gb != null && dk.free_gb < 2 ? "bad" : ""], ["Up", dur(S.uptime_s)]])}
      ${dk.total_gb ? bar(dk.used_gb, dk.total_gb, dk.used_gb / dk.total_gb > .85 ? "amber" : "") + `<div class="dim">${dk.used_gb} of ${dk.total_gb} GB used</div>` : ""}
      ${Y.cache && Y.cache.limit ? `<div class="dim">Download cache ${(Y.cache.bytes / 1e9).toFixed(1)} GB · room for ${(Y.cache.limit / 1e9).toFixed(0)} GB (oldest cleared only if the disk gets nearly full)</div>` : ""}
      <div class="row"><b>Backup</b><span class="${Y.last_backup && Date.now() / 1000 - Y.last_backup < 2 * 86400 ? "ok" : "bad"}">${Y.last_backup ? ago(Y.last_backup) : "none yet"}</span><span></span></div>
      ${Y.lockouts ? `<div class="bad">${Y.lockouts} sign-in lockout${Y.lockouts === 1 ? "" : "s"} right now</div>` : ""}</div>`);
    $("screens").innerHTML = scr.join("");
    $("stUpd").textContent = "Live · " + new Date().toLocaleTimeString();
    $("screens").querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { await api("/api/admin/data/prebuild-all", { method: "POST", json: { start: b.dataset.act === "start" } }); } catch (e) { alert(e.message); }
      tick();
    });
    $("screens").querySelectorAll("[data-retry]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { await api("/api/admin/data/prebuild", { method: "POST", json: { zip: b.dataset.retry } }); } catch (e) { alert(e.message); }
      tick();
    });
  }
  async function tick() {
    clearTimeout(timer);
    if (!on) return;
    try { const S = await api("/api/admin/status"); $("stKey").classList.add("hidden"); render(S); }
    catch (e) {
      if (/admin|401|key/i.test(e.message)) { $("stKey").classList.remove("hidden"); return; }
      $("stUpd").textContent = "Reconnecting… (" + e.message + ")";
    }
    timer = setTimeout(tick, document.hidden ? 30000 : 5000);
  }
  $("stGo").onclick = () => { localStorage.setItem("adminToken", $("stTok").value.trim()); tick(); };
  addEventListener("cc-tab", (e) => { on = e.detail === "status"; if (on) tick(); else clearTimeout(timer); });
  document.addEventListener("visibilitychange", () => { if (on && !document.hidden) tick(); });
  if (((location.hash || "#status").slice(1)) === "status") { on = true; tick(); }
})();
</script>
</body>
</html>
